<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">Maji — Loading Animation 01: Awning Bounce &amp; Smile Reveal</title>
  <style>
    #awning {
      transform-box: fill-box;
      transform-origin: 50% 0%;
      animation: awningBounce 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    #smile {
      transform-box: fill-box;
      transform-origin: 50% 0%;
      animation: smilePop 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes awningBounce {
      0%, 100% { transform: translateY(0) scaleY(1); }
      18% { transform: translateY(-14px) scaleY(0.92); }
      38% { transform: translateY(6px) scaleY(1.06); }
      55% { transform: translateY(-2px) scaleY(0.99); }
      70% { transform: translateY(0) scaleY(1); }
    }
    @keyframes smilePop {
      0%, 12% { transform: scale(0.75) translateY(-8px); opacity: 0.35; }
      42% { transform: scale(1.06) translateY(4px); opacity: 1; }
      65%, 100% { transform: scale(1) translateY(0); opacity: 1; }
    }
  </style>
  <g id="symbol">
    <path id="awning" fill="#F05A28" d="M28 84 L80 32 H100 L128 60 L156 32 H176 L228 84 V92 A34 34 0 0 1 160 92 V104 A32 32 0 0 1 96 104 V92 A34 34 0 0 1 28 92 Z"/>
    <path id="smile" fill="#F05A28" d="M48 140 H84 V144 A44 44 0 0 0 172 144 V140 H208 V144 A80 80 0 0 1 48 144 Z"/>
  </g>
</svg>
