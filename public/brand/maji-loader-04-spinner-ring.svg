<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">Maji — Loading Animation 04: Checkout &amp; Button Orbit Spinner</title>
  <style>
    #orbit-ring {
      transform-origin: 128px 128px;
      animation: spinOrbit 1.1s linear infinite;
    }
    #core-mark {
      transform-origin: 128px 128px;
      animation: gentleBreath 1.1s ease-in-out infinite;
    }
    @keyframes spinOrbit {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes gentleBreath {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.94); }
    }
  </style>
  <circle cx="128" cy="128" r="112" fill="none" stroke="#F05A28" stroke-opacity="0.16" stroke-width="16"/>
  <circle id="orbit-ring" cx="128" cy="128" r="112" fill="none" stroke="#F05A28" stroke-width="16" stroke-linecap="round" stroke-dasharray="220 500"/>
  <g id="core-mark">
    <svg x="54" y="54" width="148" height="148" viewBox="0 0 256 256">
      <path fill="#F05A28" d="M28 84 L80 32 H100 L128 60 L156 32 H176 L228 84 V92 A34 34 0 0 1 160 92 V104 A32 32 0 0 1 96 104 V92 A34 34 0 0 1 28 92 Z"/>
      <path fill="#F05A28" d="M48 140 H84 V144 A44 44 0 0 0 172 144 V140 H208 V144 A80 80 0 0 1 48 144 Z"/>
    </svg>
  </g>
</svg>
